xt)}.top-actions{display:flex;align-items:center;gap:9px}.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:10px;padding:10px 14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:13px}.btn:hover{border-color:var(--accent)}.btn.primary{background:var(--accent);border-color:var(--accent);color:white}.btn.soft{background:var(--soft);border-color:transparent;color:var(--accent)}.btn.small{padding:7px 10px;font-size:12px}.iconbtn{height:39px;width:40px;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:10px}.page{padding:28px 30px 55px;max-width:1500px;margin:auto}.pagehead{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:24px}.eyebrow{font:800 10px Manrope;letter-spacing:1.8px;color:var(--accent)}h1{font-size:30px;line-height:1.25;margin:6px 0 7px}h2{font-size:19px;margin:0}h3{font-size:16px;margin:0}.muted{color:var(--muted)}.pagehead p{margin:0;color:var(--muted);font-size:14px}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;margin-bottom:22px}.stat{border:1px solid var(--line);border-radius:15px;background:var(--panel);padding:18px;min-width:0;box-shadow:var(--shadow)}.stat-top{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:12px}.stat-icon{height:35px;width:35px;display:grid;place-items:center;background:var(--soft);color:var(--accent);border-radius:10px;font-size:18px}.stat strong{display:block;font:800 27px Manrope;margin:14px 0 4px}.stat small{font-size:11px;color:var(--muted)}.layout2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(280px,1fr);gap:18px}.panel{border:1px solid var(--line);border-radius:15px;background:var(--panel);overflow:hidden;min-width:0}.panel-head{padding:18px 20px;display:flex;justify-content:space-between;gap:12px;align-items:center;border-bottom:1px solid var(--line)}.panel-body{padding:18px 20px}.rows{display:grid;gap:0}.item{display:flex;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0}.thumb{width:54px;height:54px;flex-shrink:0;border-radius:11px;background:linear-gradient(135deg,#a5163c,#ff735e);display:grid;place-items:center;color:white;font-size:22px;font-weight:800;overflow:hidden}.thumb img{width:100%;height:100%;object-fit:cover}.item-main{min-width:0;flex:1}.item-main strong{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.item-main small{display:block;color:var(--muted);font-size:11px;margin-top:4px}.badge{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:5px 8px;font-size:10px;font-weight:700;white-space:nowrap;background:var(--panel2);color:var(--muted)}.badge.live,.badge.published,.badge.paid{background:color-mix(in srgb,var(--green) 13%,transparent);color:var(--green)}.badge.draft,.badge.pending{background:color-mix(in srgb,var(--yellow) 13%,transparent);color:var(--yellow)}.badge.scheduled{background:color-mix(in srgb,#5f9bff 13%,transparent);color:#7babff}.quickgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.quick{border:1px solid var(--line);border-radius:12px;background:var(--panel2);padding:14px;text-align:left;color:var(--text)}.quick span{font-size:20px;color:var(--accent)}.quick strong{display:block;margin-top:8px;font-size:13px}.quick small{display:block;margin-top:3px;color:var(--muted);font-size:11px}.tablewrap{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:690px;font-size:13px}th,td{text-align:left;padding:13px 15px;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--muted);font-size:11px;font-weight:600;background:var(--panel2)}tbody tr:last-child td{border-bottom:0}.tabletitle{display:flex;align-items:center;gap:10px}.tabletitle .thumb{width:36px;height:36px;font-size:14px;border-radius:8px}.actions-cell{display:flex;gap:6px}.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:15px}.search{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--text);min-width:190px;outline:none}.search:focus,input:focus,textarea:focus,select:focus{border-color:var(--accent)!important;outline:2px solid color-mix(in srgb,var(--accent) 12%,transparent)}.toolbar .search{flex:1}.empty{padding:35px 15px;text-align:center;color:var(--muted)}.empty strong{display:block;color:var(--text);margin-bottom:5px}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.field{display:grid;gap:6px;min-width:0}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:700}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:11px 12px;color:var(--text);min-width:0}.field textarea{min-height:95px;resize:vertical}.hint{font-size:11px;color:var(--muted);line-height:1.65}.formactions{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-top:19px;flex-wrap:wrap}.cover-preview{height:180px;border-radius:13px;background:linear-gradient(130deg,#861633,#f46c58);padding:18px;color:white;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;position:relative}.cover-preview img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.cover-preview>*:not(img){position:relative}.cover-preview b{font-size:24px;max-width:90%}.cover-preview span{font-size:11px}.drop{border:1px dashed var(--line);background:var(--panel2);padding:16px;border-radius:12px}.notice{padding:12px 14px;background:var(--soft);color:var(--text);border-radius:11px;font-size:12px;line-height:1.7}.toast{position:fixed;right:22px;bottom:22px;z-index:40;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:12px;padding:13px 17px;font-size:13px;max-width:calc(100vw - 40px)}.hidden{display:none!important}.mobile-brand{display:none}.modalback{position:fixed;inset:0;background:#0009;z-index:50;display:grid;place-items:center;padding:18px}.modal{max-width:620px;width:100%;max-height:90vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.modalhead{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.modalbody{padding:21px}.modalfoot{padding:16px 21px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:9px}.warning{color:var(--yellow)}.sessioncard{border:1px solid var(--line);background:var(--panel2);border-radius:13px;padding:14px;display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:10px}.sessioncard strong{font-size:14px}.sessioncard small{display:block;color:var(--muted);font-size:11px;margin-top:5px}.progress{height:6px;background:var(--panel2);border-radius:9px;overflow:hidden}.progress span{display:block;background:var(--accent);height:100%;border-radius:9px}
@media(max-width:1100px){.app{grid-template-columns:215px minmax(0,1fr)}.page{padding:23px 20px}.topbar{padding:0 20px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.layout2{grid-template-columns:1fr}}
@media(max-width:720px){.app{grid-template-columns:1fr}.sidebar{position:fixed;left:-270px;width:250px;transition:left .2s;box-shadow:var(--shadow)}.sidebar.open{left:0}.mobile-brand{display:block}.topbar{height:65px;padding:0 14px}.page{padding:21px 14px 45px}.pagehead{flex-direction:column}.pagehead .headactions{display:flex;gap:8px;flex-wrap:wrap}.stats{gap:9px}.stat{padding:13px}.stat strong{font-size:23px}.stat-top{align-items:flex-start;gap:5px}.stat-icon{width:29px;height:29px}.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}.quickgrid{grid-template-columns:repeat(2,1fr)}.panel-head,.panel-body{padding:15px}.footrow{flex-direction:column}.hide-mobile{display:none!important}.top-actions{gap:6px}}

<div class="app">

<main class="main">

<div class="page" id="page"></div>
</main>
</div>
<div id="modalRoot"></div><div id="toast" class="toast hidden" role="status"></div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const starterCourses=[
{id:'FOC-001',name:'বিশ্ববিদ্যালয় ভর্তি প্রস্তুতি',category:'ভর্তি প্রস্তুতি',level:'HSC / ভর্তি',price:2500,discount:1990,status:'published',cover:'',description:'টার্গেটভিত্তিক সিলেবাস, লাইভ ক্লাস, রেকর্ডেড লেসন ও মডেল টেস্ট।',teacher:'Focus Faculty',lessons:24,students:128},
{id:'FOC-002',name:'HSC বিজ্ঞান — পদার্থবিজ্ঞান',category:'একাডেমিক',level:'HSC',price:1200,discount:990,status:'published',cover:'',description:'কনসেপ্ট ক্লাস, অধ্যায়ভিত্তিক পরীক্ষা ও সমাধান।',teacher:'Physics Team',lessons:18,students:82},
{id:'FOC-003',name:'ইঞ্জিনিয়ারিং মডেল টেস্ট',category:'মডেল টেস্ট',level:'ভর্তি',price:750,discount:0,status:'draft',cover:'',description:'টাইমড প্র্যাকটিস, ফলাফল ও প্রশ্ন বিশ্লেষণ।',teacher:'Exam Team',lessons:12,students:0}
];
const starterClasses=[
{id:'CLS-101',title:'ভেক্টর: বেসিক কনসেপ্ট',courseId:'FOC-002',type:'recorded',date:'',time:'',duration:60,videoUrl:'',status:'published'},
{id:'CLS-102',title:'ভর্তি প্রস্তুতি: রুটিন ও কৌশল',courseId:'FOC-001',type:'live',date:'2026-10-22',time:'20:00',duration:90,videoUrl:'',status:'scheduled'},
{id:'CLS-103',title:'মডেল টেস্ট নির্দেশনা',courseId:'FOC-003',type:'recorded',date:'',time:'',duration:25,videoUrl:'',status:'draft'}
];
const starterOrders=[
{id:'ORD-2601',student:'Demo Student',email:'student@example.com',courseId:'FOC-001',amount:1990,status:'paid',date:'2026-10-18'},
{id:'ORD-2602',student:'Sample Learner',email:'learner@example.com',courseId:'FOC-002',amount:990,status:'pending',date:'2026-10-19'},
{id:'ORD-2603',student:'New Student',email:'new@example.com',courseId:'FOC-001',amount:1990,status:'pending',date:'2026-10-19'}
];
function load(key,fallback){try{const v=localStorage.getItem('focus-admin-'+key);return v?JSON.parse(v):fallback}catch(e){return fallback}}
let courses=load('courses',starterCourses),classes=load('classes',starterClasses),materials=load('materials',[]),orders=load('orders',starterOrders),students=load('students',[{id:'STU-001',name:'Demo Student',email:'student@example.com',joined:'2026-09-20',courses:1,status:'active'},{id:'STU-002',name:'Sample Learner',email:'learner@example.com',joined:'2026-10-01',courses:1,status:'active'},{id:'STU-003',name:'New Student',email:'new@example.com',joined:'2026-10-19',courses:0,status:'active'}]);
let view='overview',editingCourse=null,editingClass=null,materialCourse='all',toastTimer;
function save(){try{localStorage.setItem('focus-admin-courses',JSON.stringify(courses));localStorage.setItem('focus-admin-classes',JSON.stringify(classes));localStorage.setItem('focus-admin-materials',JSON.stringify(materials));localStorage.setItem('focus-admin-orders',JSON.stringify(orders));localStorage.setItem('focus-admin-students',JSON.stringify(students))}catch(e){notify('Storage full or unavailable. Export your data before continuing.');}}
function notify(msg){const t=$('#toast');t.textContent=msg;t.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.add('hidden'),3200)}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function courseName(id){return courses.find(c=>c.id===id)?.name||'Unassigned course'}
function money(n){return '৳'+Number(n||0).toLocaleString('en-US')}
function statusBadge(status){const map={published:['Published','published'],draft:['Draft','draft'],scheduled:['Scheduled','scheduled'],live:['● LIVE','live'],paid:['Paid','paid'],pending:['Pending','pending'],active:['Active','published'],refunded:['Refunded','draft']};let x=map[status]||[status,'draft'];return '<span class="badge '+x[1]+'">'+x[0]+'</span>'}
function coverStyle(c){return c.cover?'background-image:url('+JSON.stringify(c.cover)+')':'background:linear-gradient(130deg,#8c1532,#ff6b58)'}
function thumb(c){return '<div class="thumb" style="'+(c.cover?'background-image:url('+JSON.stringify(c.cover)+');background-size:cover;background-position:center':'')+'">'+(c.cover?'':esc((c.name||c.title||'F').slice(0,1)))+'</div>'}
function topHead(k,title,desc,buttons=''){return '<div class="pagehead"><div><div class="eyebrow">'+k+'</div><h1>'+title+'</h1><p>'+desc+'</p></div><div class="headactions">'+buttons+'</div></div>'}
function btn(label,action,cls=''){return '<button class="btn '+cls+'" data-action="'+action+'">'+label+'</button>'}
function statsCards(items){return '<div class="stats">'+items.map(x=>'<div class="stat"><div class="stat-top"><span>'+x.label+'</span><span class="stat-icon">'+x.icon+'</span></div><strong>'+x.value+'</strong><small>'+x.note+'</small></div>').join('')+'</div>'}
function courseRows(arr){if(!arr.length)return '<div class="empty"><strong>কোনো কোর্স পাওয়া যায়নি</strong>নতুন কোর্স তৈরি করে শুরু করো।</div>';return arr.map(c=>'<div class="item">'+thumb(c)+'<div class="item-main"><strong>'+esc(c.name)+'</strong><small>'+esc(c.id)+' · '+esc(c.category)+' · '+c.lessons+' lessons</small></div>'+statusBadge(c.status)+'<button class="btn small" data-action="edit-course" data-id="'+c.id+'">Edit</button></div>').join('')}
function render(){const page=$('#page');$('#crumb').textContent=({overview:'Overview',courses:'Courses & Programs',classes:'Classes & Lessons',live:'Live classes',materials:'Notes & materials',orders:'Orders & purchases',students:'Students',settings:'Settings & integrations'})[view];$$('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===view));if(view==='overview')page.innerHTML=overviewPage();if(view==='courses')page.innerHTML=coursesPage();if(view==='classes')page.innerHTML=classesPage();if(view==='live')page.innerHTML=livePage();if(view==='materials')page.innerHTML=materialsPage();if(view==='orders')page.innerHTML=ordersPage();if(view==='students')page.innerHTML=studentsPage();if(view==='settings')page.innerHTML=settingsPage()}

ction></div><section class="panel" style="margin-top:18px"><div class="panel-head"><h2>Upcoming classes</h2>'+btn('View schedule →','goto-live','small')+'</div><div class="panel-body">'+classes.filter(c=>c.type==='live').map(c=>'<div class="sessioncard"><div>'+statusBadge(c.status)+'<br><strong>'+esc(c.title)+'</strong><small>'+esc(courseName(c.courseId))+' · '+esc(c.date||'Date not set')+' '+esc(c.time||'')+'</small></div>'+btn('Edit','edit-class','small')+'</div>').join('')+'</div></section>'}

function courseForm(c={}){editingCourse=c.id||null;let isEdit=!!c.id;modal(isEdit?'Edit course':'Create a course','<form id="courseForm"><div class="formgrid"><div class="field full"><label>Course name *</label><input name="name" required maxlength="120" value="'+esc(c.name||'')+'" placeholder="e.g. HSC Physics Masterclass"></div><div class="field"><label>Category</label><select name="category"><option '+((c.category||'ভর্তি প্রস্তুতি')==='ভর্তি প্রস্তুতি'?'selected':'')+'>ভর্তি প্রস্তুতি</option><option '+(c.category==='একাডেমিক'?'selected':'')+'>একাডেমিক</option><option '+(c.category==='মডেল টেস্ট'?'selected':'')+'>মডেল টেস্ট</option><option '+(c.category==='অনলাইন ক্লাস'?'selected':'')+'>অনলাইন ক্লাস</option></select></div><div class="field"><label>Target level</label><input name="level" value="'+esc(c.level||'HSC / ভর্তি')+'" placeholder="HSC / Admission"></div><div class="field"><label>Regular price (৳)</label><input name="price" type="number" min="0" step="1" value="'+(c.price??0)+'"></div><div class="field"><label>Discount price (৳, optional)</label><input name="discount" type="number" min="0" step="1" value="'+(c.discount??0)+'"></div><div class="field"><label>Instructor / team</label><input name="teacher" value="'+esc(c.teacher||'Focus Faculty')+'"></div><div class="field"><label>Initial lesson count</label><input name="lessons" type="number" min="0" value="'+(c.lessons??0)+'"></div><div class="field full"><label>Course cover image</label><input name="coverFile" id="coverFile" type="file" accept="image/*"><input name="cover" id="coverUrl" placeholder="Or paste public image URL" value="'+esc(c.cover||'')+'"><div class="cover-preview" id="coverPreview" style="'+(c.cover?'background-image:url('+JSON.stringify(c.cover)+');background-size:cover;background-position:center':'')+'"><span>FOCUS · COURSE COVER</span><b id="coverTitle">'+esc(c.name||'তোমার কোর্সের নাম')+'</b><span id="coverCat">'+esc(c.category||'ভর্তি প্রস্তুতি')+'</span></div><span class="hint">Preview only. Production cover upload needs cloud storage. Small image data may be stored locally for this demo.</span></div><div class="field full"><label>Course description</label><textarea name="description" maxlength="1500" placeholder="Course details, outcomes, schedule...">'+esc(c.description||'')+'</textarea></div><div class="field"><label>Publication status</label><select name="status"><option value="draft" '+((c.status||'draft')==='draft'?'selected':'')+'>Draft</option><option value="published" '+(c.status==='published'?'selected':'')+'>Published (demo)</option></select></div><div class="field"><label>Course ID</label><input value="'+esc(c.id||'Auto-generated on save')+'" disabled></div></div></form>','<button class="btn" data-close-modal>Cancel</button><button class="btn primary" id="saveCourse">Save course</button>');
const form=$('#courseForm'),titleInput=form.elements.name,cat=form.elements.category,url=form.elements.cover,file=form.elements.coverFile,preview=$('#coverPreview');function upd(){ $('#coverTitle').textContent=titleInput.value||'তোমার কোর্সের নাম';$('#coverCat').textContent=cat.value;preview.style.backgroundImage=url.value?'url('+JSON.stringify(url.value)+')':'';preview.style.backgroundSize='cover';preview.style.backgroundPosition='center';}titleInput.addEventListener('input',upd);cat.addEventListener('change',upd);url.addEventListener('input',upd);file.addEventListener('change',()=>{const f=file.files[0];if(!f)return;if(f.size>800000){notify('For demo storage choose an image under 800 KB, or use an image URL.');file.value='';return}const reader=new FileReader();reader.onload=()=>{url.value=reader.result;upd()};reader.readAsDataURL(f)});$('#saveCourse').onclick=()=>{if(!form.reportValidity())return;const fd=new FormData(form),data=Object.fromEntries(fd.entries());const prev=courses.find(x=>x.id===editingCourse);let item={id:editingCourse||('FOC-'+String(Date.now()).slice(-6)),name:data.name.trim(),category:data.category,level:data.level,price:Number(data.price)||0,discount:Number(data.discount)||0,teacher:data.teacher,lessons:Number(data.lessons)||0,description:data.description,cover:data.cover,status:data.status,students:prev?.students||0};if(item.discount>item.price&&item.price>0){notify('Discount price should not exceed regular price.');return}if(prev)courses=courses.map(x=>x.id===editingCourse?item:x);else courses.unshift(item);save();$('#modalRoot').innerHTML='';view='courses';render();notify('Course saved in this browser.');};}
function classForm(c={},forceLive=false){editingClass=c.id||null;const live=forceLive||c.type==='live';modal(c.id?'Edit class':'Create a class', '<form id="classForm"><div class="formgrid"><div class="field full"><label>Class / lesson title *</label><input name="title" required value="'+esc(c.title||'')+'" placeholder="Class title"></div><div class="field full"><label>Assign to course *</label><select name="courseId" required>'+courses.map(x=>'<option value="'+x.id+'" '+((c.courseId||courses[0]?.id)===x.id?'selected':'')+'>'+esc(x.name)+'</option>').join('')+'</select></div><div class="field"><label>Content type</label><select name="type" id="classTypeSelect"><option value="recorded" '+(!live?'selected':'')+'>Recorded lesson</option><option value="live" '+(live?'selected':'')+'>Live class</option></select></div><div class="field"><label>Duration (minutes)</label><input name="duration" type="number" min="1" value="'+(c.duration||60)+'"></div><div class="field"><label>Class date (for live)</label><input name="date" type="date" value="'+esc(c.date||'')+'"></div><div class="field"><label>Start time (for live)</label><input name="time" type="time" value="'+esc(c.time||'')+'"></div><div class="field full"><label>Video / meeting URL</label><input name="videoUrl" type="url" value="'+esc(c.videoUrl||'')+'" placeholder="https://..."><span class="hint">Only add links you own or are authorized to share. Protected replay access needs server-side authorization.</span></div><div class="field"><label>Status</label><select name="status"><option value="draft" '+((c.status||'draft')==='draft'?'selected':'')+'>Draft</option><option value="scheduled" '+(c.status==='scheduled'?'selected':'')+'>Scheduled</option><option value="published" '+(c.status==='published'?'selected':'')+'>Published (demo)</option><option value="live" '+(c.status==='live'?'selected':'')+'>Live now (demo label)</option></select></div></div></form>', '<button class="btn" data-close-modal>Cancel</button><button class= $('#saveClass').onclick=()=>{const f=$('#classForm');if(!f.reportValidity())return;const d=Object.fromEntries(new FormData(f).entries());if(!d.courseId){notify('Create a course first.');return}const prev=classes.find(x=>x.id===editingClass),item={id:editingClass||'CLS-'+String(Date.now()).slice(-6),title:d.title.trim(),courseId:d.courseId,type:d.type,duration:Number(d.duration)||60,date:d.date,time:d.time,videoUrl:d.videoUrl,status:d.status};if(prev)classes=classes.map(x=>x.id===editingClass?item:x);else classes.unshift(item);let course=courses.find(x=>x.id===item.courseId);if(course&&!prev){course.lessons=(Number(course.lessons)||0)+1}save();$('#modalRoot').innerHTML='';view=item.type==='live'?'live':'classes';render();notify('Class saved in this browser.');}}
function materialForm(){if(!courses.length){notify('Create a course before adding notes.');return}modal('Add notes or material','<form id="materialForm"><div class="formgrid"><div class="field full"><label>Resource title *</label><input name="title" required placeholder="Chapter 01 — PDF notes"></div><div class="field full"><label>Course *</label><select name="courseId">'+courses.map(c=>'<option value="'+c.id+'">'+esc(c.name)+'</option>').join('')+'</select></div><div class="field full"><label>PDF file (demo selection)</label><input id="pdfFile" type="file" accept="application/pdf"><span class="hint" id="pdfName">Choose a PDF to record its name. File is not uploaded to a server in this prototype.</span></div><div class="field full"><label>Or resource URL</label><input name="url" type="url" placeholder="https://.../notes.pdf"></div><div class="field"><label>Status</label><select name="status"><option value="published">Published (demo)</option><option value="draft">Draft</option></select></div></div></form>','<button class="btn" data-close-modal>Cancel</button><button class="btn primary" id="saveMaterial">Save resource</button>');let chosen=null;$('#pdfFile').onchange=()=>{chosen=$('#pdfFile').files[0];if(chosen&&chosen.type!=='application/pdf'){notify('Please choose a PDF file.');chosen=null;return}$('#pdfName').textContent=chosen?chosen.name+' · '+Math.round(chosen.size/1024)+' KB':'No file selected'};$('#saveMaterial').onclick=()=>{const f=$('#materialForm');if(!f.reportValidity())return;let d=Object.fromEntries(new FormData(f).entries());materials.unshift({id:'MAT-'+Date.now(),title:d.title,courseId:d.courseId,filename:chosen?.name||'',url:d.url,status:d.status});save();$('#modalRoot').innerHTML='';view='materials';render();notify('Resource metadata saved. Upload needs connected storage.');};}
function exportCSV(rows,filename){const csv=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;a.click();URL.revokeObjectURL(url);notify('CSV exported.')}
function exportData(){const blob=new Blob([JSON.stringify({courses,classes,materials,orders,students},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='focus-admin-demo-backup.json';a.click();URL.revokeObjectURL(url);notify('Demo backup downloaded.')}
document.addEventListener('click',e=>{const nav=e.target.closest('[data-view]');if(nav){view=nav.dataset.view;render();$('#sidebar').classList.remove('open');return}const action=e.target.closest('[data-action]');if(action){const id=action.dataset.id;switch(action.dataset.action){case'new-course':courseForm();break;case'edit-course':courseForm(courses.find(c=>c.id===id)||{});break;case'toggle-course':{let c=courses.find(c=>c.id===id);if(c){c.status=c.status==='published'?'draft':'published';save();render();notify('Course status changed locally.')}break}case'new-class':classForm();break;case'new-live':classForm({type:'live',status:'scheduled',duration:60},true);break;case'edit-class':classForm(classes.find(c=>c.id===id)||{});break;case'toggle-class':{let c=classes.find(c=>c.id===id);if(c){c.status=c.status==='published'?'draft':'published';save();render();notify('Class status changed locally.')}break}case'new-material':materialForm();break;case'delete-material':materials=materials.filter(m=>m.id!==id);save();render();notify('Material record deleted.');break;case'goto-courses':view='courses';render();break;case'goto-live':view='live';render();break;case'export-orders':exportCSV([['Order ID','Student','Email','Course','Amount','Date','Status'],...orders.map(o=>[o.id,o.student,o.email,courseName(o.courseId),o.amount,o.date,o.status])],'focus-orders.csv');break;case'export-students':exportCSV([['ID','Name','Email','Joined','Courses','Status'],...students.map(s=>[s.id,s.name,s.email,s.joined,s.courses,s.status])],'focus-students.csv');break;case'export-data':exportData();break;case'import-data':$('#importFile').click();break;case'reset-demo':if(confirm('Reset all admin demo records in this browser?')){courses=starterCourses.map(x=>({...x}));classes=starterClasses.map(x=>({...x}));materials=[];orders=starterOrders.map(x=>({...x}));students=load('students',[{id:'STU-001',name:'Demo Student',email:'student@example.com',joined:'2026-09-20',courses:1,status:'active'}]);save();render();notify('Demo records reset.')}break}return}if(e.target.closest('[data-close-modal]'))$('#modalRoot').innerHTML=''});
$('#nav').addEventListener('click',e=>{let b=e.target.closest('[data-view]');if(b){view=b.dataset.view;render()}});
document.addEventListener('click',e=>{if(e.target.id==='newCourseTop')courseForm()});
$('#themeBtn').onclick=()=>{const t=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=t;try{localStorage.setItem('focus-admin-theme',t)}catch(e){}$('#themeBtn').textContent=t==='dark'?'☼':'☾'};
try{const t=localStorage.getItem('focus-admin-theme');if(t)document.documentElement.dataset.theme=t}catch(e){}
$('#sideToggle').onclick=()=>$('#sidebar').classList.toggle('open');
document.addEventListener('input',e=>{if(e.target.id==='courseSearch'||e.target.id==='courseStatus'){const q=($('#courseSearch')?.value||'').toLowerCase(),s=$('#courseStatus')?.value||'all';const arr=courses.filter(c=>(c.name+' '+c.id).toLowerCase().includes(q)&&(s==='all'||c.status===s));$('#courseTable').innerHTML=courseTableRows(arr)}if(e.target.id==='classSearch'||e.target.id==='classType'){const q=($('#classSearch')?.value||'').toLowerCase(),s=$('#classType')?.value||'all';$('#classTable').innerHTML=classRows(classes.filter(c=>(c.title+' '+c.id).toLowerCase().includes(q)&&(s==='all'||c.type===s)))}if(e.target.id==='orderSearch'||e.target.id==='orderStatus'){const q=($('#orderSearch')?.value||'').toLowerCase(),s=$('#orderStatus')?.value||'all';$('#orderTable').innerHTML=orderRows(orders.filter(o=>(o.student+' '+o.email+' '+o.id).toLowerCase().includes(q)&&(s==='all'||o.status===s)))}if(e.target.id==='studentSearch'){const q=e.target.value.toLowerCase();$('#studentTable').innerHTML=studentRows(students.filter(s=>(s.name+' '+s.email).toLowerCase().includes(q)))}if(e.target.id==='materialCourse'){materialCourse=e.target.value;render()}});
document.addEventListener('change',e=>{if(e.target.matches('[data-order-status]')){let o=orders.find(x=>x.id===e.target.dataset.orderStatus);if(o){o.status=e.target.value;save();render();notify('Demo order updated. No payment has been processed.')}}if(e.target.id==='importFile'&&e.target.files[0]){const reader=new FileReader();reader.onload=()=>{try{let d=JSON.parse(reader.result);if(!Array.isArray(d.courses)||!Array.isArray(d.classes))throw new Error('invalid');courses=d.courses;classes=d.classes;materials=Array.isArray(d.materials)?d.materials:[];orders=Array.isArray(d.orders)?d.orders:[];students=Array.isArray(d.students)?d.students:[];save();render();notify('Demo backup imported.')}catch(err){notify('Invalid or unsupported JSON backup.')}};reader.readAsText(e.target.files[0]);e.target.value=''}});
save();render();
